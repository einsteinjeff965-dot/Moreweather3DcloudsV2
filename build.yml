name: Build 3D Clouds shader
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar
        run: bash build.sh
      - name: Guardar o .mcpack
        uses: actions/upload-artifact@v4
        with:
          name: Moreweather_3DClouds_Shader
          path: dist/*.mcpack
          if-no-files-found: error
      - name: Guardar arquivos de diagnóstico (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico
          path: |
            .build/Particle
            .build/project.json
          if-no-files-found: ignore
